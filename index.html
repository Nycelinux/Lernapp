<!DOCTYPE html>

<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title> Lernapp </title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <div id="game">
        <div id="room">
            <div id="lighting"></div>
            <div id="player-sign">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
                <div id="sign-content">
                    <div id="level-text">
                        Lvl. <span id="level">0</span>
                    </div>

                    <div id="xp-bar">
                        <div id="xp-fill"></div>
                    </div>
                    <div id="xp-text">
                        0/100 XP
                    </div>
                </div>

            </div>

            <!--Hitboxen-->
            <!--Schreibtisch-->
            <div id="desk-hitbox"></div>
            <!--Bett-->
            <!--Bücherregal-->
            <!--Planzen-->


        </div>

    </div>
    <!--Choose Timer popup-->
    <div id="timer-menu" class="hidden">
        <h2> Lernsession</h2>
        <button onclick="startTimer(120, 10, 2)">
            2 Minuten (+10 XP)
        </button>
        <button onclick="startTimer(300, 25, 5)">
            5 Minuten (+25 XP)
        </button>
        <button onclick="startTimer(600, 60, 10)">
            10 Minuten (+60 XP)
        </button>
        <button onclick="startTimer(900, 90, 15)">
            15 Minuten (+90 XP)
        </button>
        <button onclick="startTimer(1800, 200, 30)">
            30 Minuten (+200 XP)
        </button>
        <button onclick="startTimer(2700, 350, 45)">
            45 Minuten (+350 XP)
        </button>
        <button onclick="startTimer(3600, 500, 60)">
            60 Minuten (+500 XP)
        </button>


        <button onclick="closeTimerMenu()">
            Schließen
        </button>
    </div>

    <!-- Learn Timer popup-->
    <div id="timer-window" class="hidden">
        <div id="retro-title">
            <h2> Study Time</h2>
        </div>
        <div id="timer-display">
            00:00
        </div>
    </div>

    <!-- pixel popup-->
    <div id="popup" class="hidden">
        <h2 id="popup-title">
            Gut gemacht!
        </h2>
        <p id="popup-message">+25 XP</p>
        <button id="popup-button">Weiter</button>
    </div>

    <!-- player profile-->
    <div id="profile-window" class="hidden">
        <h2>Charakter</h2>
        <hr>
        <p>
            Level: <span id="profile-level">0</span>
        </p>
        <p>
            AKtuelle XP: <span id="profile-current-xp">0</span>
        </p>
        <p>
            Benötigte XP: <span id="profile-needed-xp">100</span>
        </p>
        <p>
            Gesamt XP: <span id="profile-total-xp">0</span>
        </p>
        <p>
            Gesamtlernzeit: <span id="profile-study-time">0 Minuten</span>
        </p>

        <!-- Haustiere,Dekorationen, Lernserie, Quests später-->

        <button id="close-profile">Schließen</button>


    </div>
    <!-- profile später-->
    <script src="js/core/config.js"></script>
    <script src="js/player/player.js"></script>
    <script src="js/core/save.js"></script>
    <script src="js/ui/popup.js"></script>
    <script src="js/room/timer.js"></script>
    <script src="js/room/room.js"></script>
    <script src="js/core/main.js"></script>
</body>
</html>
